name: Aabenra Termin Checker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt dem Skript, den Hash im Repo zu aktualisieren
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python checker.py

      - name: Save new hash if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update page hash [skip ci]'
          file_pattern: last_hash.txt
